server:
  port: 8085

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8090/eureka
  instance:
    hostname: localhost

spring:
  cloud:
    gateway:
      routes:
        - id: ms-estudiante-service-estudiantes
          uri: lb://ms-estudiante-service
          predicates:
            - Path=/estudiantes/**
        - id: ms-estudiante-service-apoderados
          uri: lb://ms-estudiante-service
          predicates:
            - Path=/apoderados/**
